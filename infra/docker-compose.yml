# ============================================================
#  Stack de la flota
# ============================================================
#  Tres servicios:
#    postgres  — gasto acumulado y claves virtuales de LiteLLM
#    litellm   — gateway de modelos (traduce API + aplica presupuestos)
#    openclaw  — orquestador, escucha Telegram
#
#  ⚠️ PLANTILLA, NO CONFIGURACIÓN PROBADA EN LA VM DESTINO.
#
#  Uso:
#    cp ../.env.example ../.env    # y completar
#    docker compose up -d
#    docker compose logs -f
# ============================================================

services:

  # ----------------------------------------------------------
  #  Base de datos de LiteLLM
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: litellm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Sin puertos publicados: solo la red interna de Docker.

  # ----------------------------------------------------------
  #  LiteLLM — gateway de modelos
  # ----------------------------------------------------------
  #  Es lo que hace funcionar a DeepSeek/Qwen/GLM con Codex:
  #  Codex solo habla Responses API, ellos solo Chat Completions.
  #  Ver docs/decisiones.md — ADR-010
  # ----------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-stable@sha256:af806882b7a6ced41658db5b6a7e98ed7b9b51d03b935e0417bf1c8552d688af
    container_name: litellm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/litellm
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY}
      TZ: ${TZ:-America/Lima}
    ports:
      # Solo local: Codex CLI corre en la misma VM.
      # No exponer a la LAN ni redirigir en el router.
      - "127.0.0.1:4000:4000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ----------------------------------------------------------
  #  OpenClaw — orquestador
  # ----------------------------------------------------------
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE}
    container_name: openclaw-gateway
    init: true
    restart: unless-stopped
    depends_on:
      - litellm
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_DISABLE_BONJOUR: "1"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TZ: ${TZ:-America/Lima}
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      # Única capacidad hacia el host: escribir solicitudes validadas.
      - ${AI_QUEUE_DIR:-/home/CAMBIAR/.local/state/ai-devops/queue}:/queue
      - ../scripts/solicitar-issue.sh:/usr/local/bin/solicitar-issue:ro
    ports:
      - "127.0.0.1:${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

# Todo el tráfico externo es SALIENTE: polling de Telegram, APIs
# de modelos y GitHub. Ningún puerto entrante desde internet.

volumes:
  postgres-data:
