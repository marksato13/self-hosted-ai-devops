# Stack autohospedado: OmniRoute gratuito + OpenClaw.
# Los puertos solo escuchan en loopback; el acceso remoto usa Tailscale.

services:
  omniroute:
    # Imagen publicada 3.8.49; manifiesto amd64 fijado por digest.
    image: diegosouzapw/omniroute@sha256:2bf79cf167478bf283c633ffef2e1e26ba746882e7267fab9320c09df56e8b57
    container_name: omniroute
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      NODE_ENV: production
      PORT: "20128"
      HOSTNAME: 0.0.0.0
      DATA_DIR: /app/data
      JWT_SECRET: ${OMNIROUTE_JWT_SECRET}
      API_KEY_SECRET: ${OMNIROUTE_API_KEY_SECRET}
      STORAGE_ENCRYPTION_KEY: ${OMNIROUTE_STORAGE_ENCRYPTION_KEY}
      STORAGE_ENCRYPTION_KEY_VERSION: v1
      INITIAL_PASSWORD: ${OMNIROUTE_INITIAL_PASSWORD}
      OMNIROUTE_MEMORY_MB: "1024"
      OMNI_MAX_CONCURRENT_CONNECTIONS: "4"
      INPUT_SANITIZER_ENABLED: "true"
      INPUT_SANITIZER_MODE: block
      INPUT_SANITIZER_BLOCK_THRESHOLD: high
      PII_REDACTION_ENABLED: "true"
      PII_RESPONSE_SANITIZATION: "true"
      AUTH_COOKIE_SECURE: "false"
      TZ: ${TZ:-America/Lima}
    volumes:
      - omniroute-data:/app/data
    ports:
      - "127.0.0.1:${OMNIROUTE_PORT:-20128}:20128"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  openclaw-gateway:
    image: ${OPENCLAW_IMAGE}
    container_name: openclaw-gateway
    init: true
    restart: unless-stopped
    depends_on:
      omniroute:
        condition: service_healthy
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_DISABLE_BONJOUR: "1"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS}
      AI_QUEUE_DIR: /queue
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY}
      TZ: ${TZ:-America/Lima}
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${AI_QUEUE_DIR:-/home/CAMBIAR/.local/state/ai-devops/queue}:/queue
      - ../config/openclaw-plugins/flota-control:/opt/openclaw-plugins/flota-control:ro
    ports:
      - "127.0.0.1:${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  omniroute-data:
