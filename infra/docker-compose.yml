# Control de producción: bot determinista y gateway OpenAI-compatible.
# Los secretos se montan desde ${AI_SECRETS_DIR}; no se guardan en .env.
services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/app/entrypoint.sh"]
    environment:
      TZ: ${TZ:-America/Bogota}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ./litellm/entrypoint.sh:/app/entrypoint.sh:ro
    secrets: [litellm_master_key, openai_api_key, anthropic_api_key, openrouter_api_key]
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:4000/health/liveliness\")'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  telegram-control:
    build:
      context: ./telegram-control
    container_name: telegram-control
    init: true
    restart: unless-stopped
    depends_on:
      litellm:
        condition: service_healthy
    environment:
      AI_QUEUE_DIR: /queue
      TELEGRAM_STATE_DIR: /state
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS}
      TZ: ${TZ:-America/Bogota}
    volumes:
      - ${AI_QUEUE_DIR:-/home/CAMBIAR/.local/state/ai-devops/queue}:/queue
      - telegram-control-state:/state
    secrets: [telegram_bot_token]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Opcional y manual: no se usa como fallback automático de código.
  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    profiles: ["local-models"]
    mem_limit: 3g
    volumes:
      - ${OLLAMA_DATA_DIR:-/home/CAMBIAR/.ollama}:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"

secrets:
  telegram_bot_token:
    file: ${AI_SECRETS_DIR}/telegram_bot_token
  litellm_master_key:
    file: ${AI_SECRETS_DIR}/litellm_master_key
  openai_api_key:
    file: ${AI_SECRETS_DIR}/openai_api_key
  anthropic_api_key:
    file: ${AI_SECRETS_DIR}/anthropic_api_key
  openrouter_api_key:
    file: ${AI_SECRETS_DIR}/openrouter_api_key

volumes:
  telegram-control-state:
