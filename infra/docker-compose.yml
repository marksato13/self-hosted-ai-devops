# ============================================================
#  Stack de la flota
# ============================================================
#  Tres servicios:
#    postgres  — gasto acumulado y claves virtuales de LiteLLM
#    litellm   — gateway de modelos (traduce API + aplica presupuestos)
#    openclaw  — orquestador, escucha Telegram
#
#  ⚠️ PLANTILLA, NO CONFIGURACIÓN PROBADA.
#  El nombre de la imagen de OpenClaw y sus variables de entorno
#  deben confirmarse en su documentación oficial. Están como
#  variables a propósito, para no dejar valores inventados.
#
#  Uso:
#    cp ../.env.example ../.env    # y completar
#    docker compose up -d
#    docker compose logs -f
# ============================================================

services:

  # ----------------------------------------------------------
  #  Base de datos de LiteLLM
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: litellm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Sin puertos publicados: solo la red interna de Docker.

  # ----------------------------------------------------------
  #  LiteLLM — gateway de modelos
  # ----------------------------------------------------------
  #  Es lo que hace funcionar a DeepSeek/Qwen/GLM con Codex:
  #  Codex solo habla Responses API, ellos solo Chat Completions.
  #  Ver docs/decisiones.md — ADR-010
  # ----------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/litellm
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY}
      TZ: ${TZ:-America/Lima}
    ports:
      # Solo local: Codex CLI corre en la misma VM.
      # No exponer a la LAN ni redirigir en el router.
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/health/liveliness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ----------------------------------------------------------
  #  OpenClaw — orquestador
  # ----------------------------------------------------------
  openclaw:
    image: ${OPENCLAW_IMAGE}
    container_name: openclaw
    restart: unless-stopped
    depends_on:
      - litellm
    env_file:
      - ../.env
    environment:
      # --- Telegram ---
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      # 🔴 CRÍTICO: sin esta allowlist, cualquier desconocido que
      # encuentre el bot obtiene control sobre esta máquina.
      # Ver docs/seguridad.md
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS}

      # --- GitHub ---
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_OWNER: ${GITHUB_OWNER}
      GITHUB_REPO: ${GITHUB_REPO}

      # --- Modelos: todo pasa por el gateway ---
      # Un solo endpoint y una sola clave, en vez de cuatro de cada.
      OPENAI_API_BASE: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}

      # --- Frenos ---
      MAX_RETRIES_PER_TASK: ${MAX_RETRIES_PER_TASK:-2}
      TASK_TIMEOUT_MINUTES: ${TASK_TIMEOUT_MINUTES:-30}
      TZ: ${TZ:-America/Lima}

    volumes:
      # Estado persistente del orquestador
      - openclaw-data:/data
      # Workspace: repo principal + worktrees de los agentes
      - ${HOME}/workspace:/workspace
    ports:
      # Panel local. Se accede por Tailscale, nunca desde internet.
      - "127.0.0.1:${OPENCLAW_PORT:-3000}:3000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

# Todo el tráfico externo es SALIENTE: polling de Telegram, APIs
# de modelos y GitHub. Ningún puerto entrante desde internet.

volumes:
  openclaw-data:
  postgres-data:
