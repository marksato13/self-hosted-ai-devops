# Stage: sirve el build de la rama que se está revisando.
# Estático a propósito — nada de ejecutar código del agente acá.
server {
    listen 80;
    server_name _;
    root /srv;
    index index.html;

    # Un stage nunca debe quedar cacheado: se reemplaza en cada vuelta
    # del bucle y las capturas tienen que ver la versión nueva.
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    etag off;

    # Un stage no es un sitio público: que no lo indexe nadie.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        # Fallback de SPA: rutas del cliente sin archivo propio.
        try_files $uri $uri/ /index.html;
    }

    location = /salud {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
